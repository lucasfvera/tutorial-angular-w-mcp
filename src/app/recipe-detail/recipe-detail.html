<div class="card">
    <div class="flex justify-between items-center gap-3">
        <h2 class="subheading">{{ recipe().name }}</h2>
        @if(recipe().isFavorite){
        <span>⭐</span>
        }
    </div>
    <img [src]="recipe().imgUrl" [attr.alt]="recipe().name" class="image">
    <p>{{ recipe().description }}</p>
    <div class="flex gap-1">
        <p>Servings: {{ servings() }}</p>
        <button class="button__primary" (click)="decrease()">-</button>
        <button class="button__primary" (click)="increase()">+</button>
    </div>
</div>
<ul>
    @for(ingredient of adjustIngredients(); track ingredient.name){
    <li>
        {{ ingredient.quantity }} {{ ingredient.unit }} {{ ingredient.name }}
    </li>
    }
</ul>
